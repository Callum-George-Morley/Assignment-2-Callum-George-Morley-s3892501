<html>
    <head>
        <title>
            Icon Suite - Assignment 2 - S3892501 Callum George Morley
        </title>
        <style>
            row{
                width:720px;
                margin: 10px auto 10px auto ;
            }
            .image-container {
                display: table-cell;
                vertical-align: middle;
                padding:20px;
            }
        </style>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/buzz/1.2.1/buzz.min.js"></script>
    </head>

    <body style="background-color: rgb(255, 255, 255);">
        <div class="row">
            <div class="image-container"><img id="icon1" src="img/icon1.png" width="200" height="210"
                onmouseover= "this.src='img/icon1a.png';"
                onmouseout= "this.src='img/icon1.png';"
                />
            </div>
            <div class="image-container"><img id="icon2" src="img/icon2.png" width="210" height="210"
                onmouseover= "this.src='img/icon2a.png';"
                onmouseout= "this.src='img/icon2.png';"
                />
            </div>
            <div class="image-container"><img id="icon3" src="img/icon3.png" width="210" height="210"
                onmouseover= "this.src='img/icon3a.png';"
                onmouseout= "this.src='img/icon3.png';"
                />
            </div>
        </div>

        <div class="row">
            <div class="image-container"><img id="icon4" src="img/icon4.png" width="200" height="200"
                onmouseover= "this.src='img/icon4a.png';"
                onmouseout= "this.src='img/icon4.png';"
                />
            </div>
            <div class="image-container"><img id="icon5" src="img/icon5.png" width="190" height="190"
                onmouseover= "this.src='img/icon5a.png';"
                onmouseout= "this.src='img/icon5.png';"
                />
            </div>
            <div class="image-container"><img id="icon6" src="img/icon6.png" width="200" height="200"
                onmouseover= "this.src='img/icon6a.png';"
                onmouseout= "this.src='img/icon6.png';"
                />
            </div>
        </div>

        <div class="row">
            <div class="image-container"><img id="icon7" src="img/icon7.png" width="200" height="200"
                onmouseover= "this.src='img/icon7a.png';"
                onmouseout= "this.src='img/icon7.png';"
                />
            </div>
            <div class="image-container"><img id="icon8" src="img/icon8.png" width="200" height="200"
                onmouseover= "this.src='img/icon8a.png';"
                onmouseout= "this.src='img/icon8.png';"
                />
            </div>
            <div class="image-container"><img id="icon9" src="img/icon9.png" width="200" height="200"
                onmouseover= "this.src='img/icon9a.png';"
                onmouseout= "this.src='img/icon9.png';"
                />
            </div>
        </div>

        <script>
            var sound1 = new buzz.sound("sound/sound1.mp3");
            var sound2 = new buzz.sound("sound/sound2.mp3");
            var sound3 = new buzz.sound("sound/sound3.mp3");
            var sound4 = new buzz.sound("sound/sound4.mp3");
            var sound5 = new buzz.sound("sound/sound5.mp3");
            var sound6 = new buzz.sound("sound/sound6.mp3");
            var sound7 = new buzz.sound("sound/sound7.mp3");
            var sound8 = new buzz.sound("sound/sound8.mp3");
            var sound9 = new buzz.sound("sound/sound9.mp3");

            window.onload = function() {
                document.getElementById('icon1').addEventListener('click', function () {sound1.play();});
                document.getElementById('icon2').addEventListener('click', function () {sound2.play();});
                document.getElementById('icon3').addEventListener('click', function () {sound3.play();});
                document.getElementById('icon4').addEventListener('click', function () {sound4.play();});
                document.getElementById('icon5').addEventListener('click', function () {sound5.play();});
                document.getElementById('icon6').addEventListener('click', function () {sound6.play();});
                document.getElementById('icon7').addEventListener('click', function () {sound7.play();});
                document.getElementById('icon8').addEventListener('click', function () {sound8.play();});
                document.getElementById('icon9').addEventListener('click', function () {sound9.play();});
            };
        </script>
    </body>

</html>
